[package]
name = "keylease-proxy"
version = "0.1.0"
description = "KeyLease proxy (wasm32-wasip2, runs in an OutLayer TEE): opens the sealed key, calls the one allowed endpoint, returns the answer scrubbed of the key."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
keylease-reasons = { path = "../../crates/keylease-reasons" }
keylease-rules = { path = "../../crates/keylease-rules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2.1"

[lints]
workspace = true

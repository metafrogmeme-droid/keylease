name: ci

on:
  pull_request:
    # `edited` re-lints the PR title and body only (every other step is skipped).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # PR text lint reads the current title and body

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'text' || 'full' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # gitleaks_8.30.1_linux_x64.tar.gz; also checked against the release checksums file.
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # cargo-near-x86_64-unknown-linux-gnu.tar.gz v0.22.0; also checked against the release .sha256 file.
  CARGO_NEAR_LINUX_X64_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a

jobs:
  # One job on purpose: private-repo minutes are billed per job, rounded up (docs/DECISIONS.md E-001).
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Changed areas
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$ACTION" = edited ]; then
            echo "full=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "full=true" >>"$GITHUB_OUTPUT"
          if [ "$EVENT" != pull_request ]; then
            echo "node=true" >>"$GITHUB_OUTPUT"; echo "rust=true" >>"$GITHUB_OUTPUT"; echo "web=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$files"
          all=false; grep -q '^\.github/workflows/' <<<"$files" && all=true
          rust=$all; grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|^rustfmt\.toml$|^rust-toolchain|^docs/WORDING\.md$' <<<"$files" && rust=true
          node=$all; grep -qvE '\.rs$|(^|/)Cargo\.(toml|lock)$|^rustfmt\.toml$|^rust-toolchain' <<<"$files" && node=true
          web=$all; grep -qE '^apps/web/|^packages/|^pnpm-lock\.yaml$' <<<"$files" && web=true
          echo "node=$node" >>"$GITHUB_OUTPUT"; echo "rust=$rust" >>"$GITHUB_OUTPUT"; echo "web=$web" >>"$GITHUB_OUTPUT"

      # --- secrets: every PR, full history, verbose ---
      - uses: actions/cache@v5
        if: steps.changes.outputs.full == 'true'
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install-gitleaks.sh', 'scripts/install-cargo-near.sh') }}
      - name: Install gitleaks (pinned, checksum-verified)
        if: steps.changes.outputs.full == 'true'
        run: scripts/install-gitleaks.sh
      - name: gitleaks full history
        if: steps.changes.outputs.full == 'true'
        run: .tools/bin/gitleaks git --config .gitleaks.toml --ignore-gitleaks-allow --redact -v --no-banner --log-opts=--all .
      - name: gitleaks self-test (planted fake keys must be caught)
        if: steps.changes.outputs.full == 'true'
        run: GITLEAKS=.tools/bin/gitleaks scripts/gitleaks-selftest.sh

      # --- repo rules: every PR (Node only, no install needed) ---
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 auto-caches from package.json `packageManager`; that fails when pnpm install was skipped.
          package-manager-cache: false
          cache: ${{ steps.changes.outputs.node == 'true' && 'pnpm' || '' }}
      - name: copy-lint
        if: steps.changes.outputs.full == 'true'
        run: node tools/repo-lint/src/cli.ts copy
      - name: env-lint
        if: steps.changes.outputs.full == 'true'
        run: node tools/repo-lint/src/cli.ts env
      - name: commit-lint (author, no tool labels)
        if: steps.changes.outputs.full == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/repo-lint/src/cli.ts commits "$BASE_SHA..$HEAD_SHA"
      # --- TypeScript ---
      - name: pnpm install
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.node == 'true'
        run: pnpm install --frozen-lockfile
      - name: eslint + prettier
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.node == 'true'
        run: pnpm lint
      - name: typecheck
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.node == 'true'
        run: pnpm typecheck
      - name: test
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.node == 'true'
        run: pnpm test
      # --- Web: Playwright on two builds (timing test with the test wallet; release build smoke) ---
      - uses: actions/cache@v5
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.web == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
      - name: Playwright (timing test, release check, smoke)
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.web == 'true'
        working-directory: apps/web
        # lib/config.ts fails the build without a contract id (no silent fallback); e2e mocks the RPC.
        env:
          NEXT_PUBLIC_KEYLEASE_CONTRACT_ID: keylease.testnet
        # Timing test on the test-wallet build, then the release build: no test wallet, smoke tests.
        run: |
          pnpm exec playwright install --only-shell chromium
          pnpm build:e2e && pnpm e2e:timing
          pnpm build && pnpm check:release && pnpm e2e

      # --- Rust ---
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.rust == 'true'
      - name: rustfmt
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.rust == 'true'
        run: cargo fmt --all --check
      - name: clippy
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo-near (prebuilt, checksum-verified, cached in .tools)
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.rust == 'true'
        run: scripts/install-cargo-near.sh && echo "$PWD/.tools/bin" >>"$GITHUB_PATH"
      - name: build contracts (wasm for the sandbox tests)
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.rust == 'true'
        run: scripts/build-contracts.sh
      - name: cargo test (unit + near-workspaces sandbox)
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.rust == 'true'
        run: cargo test --workspace --locked
      - name: proxy wasm builds reproducibly (two clean builds, same sha256)
        if: steps.changes.outputs.full == 'true' && steps.changes.outputs.rust == 'true'
        run: scripts/build-proxy.sh

      # Last on purpose: a bad PR description must not skip the code checks above.
      - name: PR title and body lint
        if: github.event_name == 'pull_request'
        # Read the PR as it is now, not the event payload, so a re-run after an edit sees the edit.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        run: set -o pipefail; gh api "$PR_API" --jq '.title + "\n" + (.body // "")' | node tools/repo-lint/src/cli.ts text

[workspace]
resolver = "2"
members = ["crates/*"]
# spike/ is a throwaway day-1 experiment with its own workspace (docs/OPEN_QUESTIONS.md Q-001/Q-002).
exclude = ["spike"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Patrick Baur (RUNECLAW)"]
repository = "https://github.com/metafrogmeme-droid/keylease"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
